<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#2338c9">
<title>Phòng thí nghiệm Vật lý 11</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@400;500;600;700;800&family=Noto+Serif:ital,wght@1,500;1,600&display=swap">
<style>
/* VOICE everyday learning: a calm, exact school physics lab
   IDEA a student's lab notebook on graph paper, written in blue ballpoint, marked with the teacher's red pen
   PICTURE the live simulation drawn large on graph paper, reacting to every control
   COLOUR white paper, ballpoint blue band and ink #2338c9, red pen #d92d20 for positive charge and key marks, orange as third series
   TYPE Be Vietnam Pro 800 titles and text; Noto Serif italic for physical quantities
   LAYOUT laptop: blue band with title and chapter tabs, simulation left, control panel right, notes in three columns; phone: title, tabs, sticky simulation, controls, notes */
:root{color-scheme:light;--bg:#ffffff;--ink:#121a33;--mute:#5a6480;--line:#dfe3f1;--panel:#f3f5fd;--pen:#2338c9;--onpen:#ffffff;--band:#2338c9}
@media (prefers-color-scheme:dark){:root:not([data-theme=light]){color-scheme:dark;--bg:#0d1122;--ink:#e9ecf6;--mute:#a3abc4;--line:#283050;--panel:#151a33;--pen:#8b98ff;--onpen:#0d1122;--band:#18206b}}
:root[data-theme=dark]{color-scheme:dark;--bg:#0d1122;--ink:#e9ecf6;--mute:#a3abc4;--line:#283050;--panel:#151a33;--pen:#8b98ff;--onpen:#0d1122;--band:#18206b}
*{box-sizing:border-box;min-width:0}
html,body{margin:0}
body{background:var(--bg);color:var(--ink);font:16px/1.55 "Be Vietnam Pro",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;overflow-x:clip}
button,select,input{font:inherit;color:inherit}
button,select,input,label,summary{touch-action:manipulation;-webkit-tap-highlight-color:transparent}
html{-webkit-text-size-adjust:100%;text-size-adjust:100%}
.band{background:var(--band);color:#fff;padding:26px max(4vw,16px) 0}
.in{max-width:1320px;margin:0 auto}
h1{font-size:clamp(30px,3.8vw,46px);line-height:1.05;letter-spacing:-.02em;font-weight:800;margin:0 0 18px;text-wrap:balance}
.lede{margin:0 0 20px;max-width:68ch;color:#dfe3ff}
.chs{display:flex;gap:4px;overflow-x:auto;scrollbar-width:none;margin:0 -4px;padding:0 4px}
.chs::-webkit-scrollbar{display:none}
.chs button{flex:none;font-size:16px;font-weight:700;line-height:1.2;color:#fff;background:transparent;border:0;border-radius:14px 14px 0 0;padding:10px 18px 14px;cursor:pointer;text-align:left;white-space:nowrap}
.chs button small{display:block;font-size:13px;font-weight:500;opacity:.8;margin-bottom:2px}
.chs button:hover{background:rgba(255,255,255,.13)}
.chs button:focus-visible{outline:2px solid #fff;outline-offset:-4px}
.chs button[aria-selected=true]{background:var(--bg);color:var(--pen)}
.wrap{max-width:1320px;margin:0 auto;padding:18px max(4vw,16px) 36px}
.sims{display:flex;flex-wrap:wrap;gap:8px;margin:0 0 18px}
.sims button{min-height:44px;padding:8px 16px;border-radius:999px;border:1.5px solid var(--line);background:var(--bg);font-size:15px;font-weight:500;cursor:pointer}
.sims button:hover{border-color:var(--pen)}
.sims button:focus-visible,.ib:focus-visible,.btn:focus-visible,.seg button:focus-visible,select:focus-visible,.lnk:focus-visible{outline:2px solid var(--pen);outline-offset:2px}
.sims button[aria-pressed=true]{background:var(--pen);border-color:var(--pen);color:var(--onpen)}
.lab{display:grid;grid-template-columns:minmax(0,1fr) 340px;gap:20px;align-items:start}
.stage{background:var(--bg);border:1.5px solid var(--line);border-radius:16px;overflow:hidden}
.sh{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:10px 12px 10px 16px;border-bottom:1.5px solid var(--line)}
.sh h2{margin:0;font-size:20px;line-height:1.25;font-weight:700}
.sh p{margin:2px 0 0;font-size:14px;line-height:1.35;color:var(--mute)}
.tp{display:flex;gap:6px;flex:none}
.tp[hidden],[hidden]{display:none!important}
.ib{width:44px;height:44px;border-radius:12px;border:1.5px solid var(--line);background:var(--bg);display:grid;place-items:center;cursor:pointer;padding:0}
.ib:hover{border-color:var(--pen);color:var(--pen)}
.ib svg{width:20px;height:20px;fill:none;stroke:currentColor;stroke-width:2.2;stroke-linecap:round;stroke-linejoin:round}
.cvb{position:relative;line-height:0}
canvas{display:block;width:100%;-webkit-user-select:none;user-select:none;-webkit-touch-callout:none}
#cv{position:relative;z-index:1}
#gl{position:absolute;left:0;top:0;display:none}
.panel{background:var(--panel);border-radius:16px;padding:18px}
.hint{margin:0 0 14px;font-size:15px;line-height:1.45;padding:10px 12px;border-radius:10px;background:var(--bg);border:1.5px dashed var(--line)}
.lbl{display:block;font-size:14px;color:var(--mute);margin:0 0 4px}
.seg{display:flex;border:1.5px solid var(--line);border-radius:12px;overflow:hidden;margin:0 0 16px;background:var(--bg)}
.seg button{flex:1;min-height:40px;border:0;background:transparent;cursor:pointer;font-size:14px;font-weight:600;color:var(--mute)}
.seg button[aria-pressed=true]{background:var(--pen);color:var(--onpen)}
.ctl{margin:0 0 12px}
.ctl label{display:flex;justify-content:space-between;align-items:baseline;gap:10px;font-size:15px;font-weight:500;margin-bottom:2px;line-height:1.35}
.ctl output{color:var(--pen);font-weight:700;font-variant-numeric:tabular-nums;white-space:nowrap}
input[type=range]{width:100%;height:32px;margin:0;background:transparent;-webkit-appearance:none;appearance:none;cursor:pointer}
input[type=range]::-webkit-slider-runnable-track{height:6px;border-radius:3px;background:var(--line)}
input[type=range]::-webkit-slider-thumb{-webkit-appearance:none;appearance:none;width:22px;height:22px;border-radius:50%;background:var(--pen);border:3px solid var(--bg);box-shadow:0 0 0 1.5px var(--pen);margin-top:-8px}
input[type=range]::-moz-range-track{height:6px;border-radius:3px;background:var(--line)}
input[type=range]::-moz-range-thumb{width:16px;height:16px;border-radius:50%;background:var(--pen);border:3px solid var(--bg);box-shadow:0 0 0 1.5px var(--pen)}
input[type=range]:focus-visible{outline:2px solid var(--pen);outline-offset:2px;border-radius:6px}
select{width:100%;min-height:44px;font-size:16px;padding:8px 10px;border-radius:10px;border:1.5px solid var(--line);background:var(--bg)}
.chk{display:flex;align-items:center;gap:10px;min-height:40px;margin:0 0 6px;font-size:15px;line-height:1.35;cursor:pointer}
.chk input{width:20px;height:20px;accent-color:var(--pen);flex:none;margin:0}
.btn{min-height:44px;padding:8px 14px;border-radius:12px;border:1.5px solid var(--pen);background:transparent;color:var(--pen);font-weight:600;cursor:pointer;margin:0 8px 12px 0}
.btn:hover{background:var(--pen);color:var(--onpen)}
.reads{margin:4px 0 0;padding:14px 0 0;border-top:1.5px solid var(--line);display:grid;grid-template-columns:minmax(0,1fr) auto;gap:6px 12px;font-size:15px;line-height:1.4}
.reads dt{color:var(--mute)}
.reads dd{margin:0;text-align:right;font-weight:600;font-variant-numeric:tabular-nums;white-space:nowrap}
.reads dd.w{white-space:normal;grid-column:1/-1;text-align:left;font-weight:500;color:var(--ink);margin-top:-2px}
.lnk{background:none;border:0;padding:12px 0 0;color:var(--pen);font-size:14px;font-weight:600;cursor:pointer;text-decoration:underline;text-underline-offset:3px}
.info{display:grid;grid-template-columns:minmax(0,1.15fr) minmax(0,1fr) minmax(0,1.15fr);gap:32px;margin-top:32px;padding-top:26px;border-top:1.5px solid var(--line)}
.info h3{font-size:19px;margin:0 0 10px;line-height:1.25}
.info p{margin:0 0 10px;max-width:68ch}
.fl{list-style:none;padding:0;margin:0}
.fl li{padding:9px 0;border-bottom:1px solid var(--line)}
.fm{font-family:"Noto Serif",Georgia,"Times New Roman",serif;font-style:italic;font-size:18px;font-weight:500}
.fl small{display:block;color:var(--mute);font-size:14px;line-height:1.4;margin-top:2px}
details{border:1.5px solid var(--line);border-radius:12px;padding:10px 14px;margin:0 0 10px}
summary{cursor:pointer;font-weight:500;line-height:1.45}
details[open] summary{color:var(--pen)}
details p{margin:8px 0 0!important;color:var(--mute)}
.foot{max-width:1320px;margin:0 auto;padding:0 max(4vw,16px) 40px;color:var(--mute);font-size:14px}
.foot p{margin:0;max-width:90ch;border-top:1.5px solid var(--line);padding-top:16px}
@media (max-width:1000px){.lab{grid-template-columns:minmax(0,1fr)}.stage{position:sticky;top:0;z-index:5;box-shadow:0 10px 18px -16px rgba(0,0,0,.55)}.ctls{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));column-gap:20px;align-items:start}.info{grid-template-columns:minmax(0,1fr);gap:20px}}
@media (max-width:600px){.stage{margin:0 calc(-1*max(4vw,16px));border-radius:0;border-left:0;border-right:0}.band{padding-top:20px}.lede{font-size:15px}.ctls{grid-template-columns:minmax(0,1fr)}.sh{padding:6px 8px 6px 12px}.sh h2{font-size:17px}.sh p{display:none}.sims button{font-size:14px;padding:8px 12px}}
</style>
</head>
<body>
<header class="band"><div class="in">
<h1>Phòng thí nghiệm Vật lý 11</h1>
<nav class="chs" id="chs" role="tablist" aria-label="Các chương"></nav>
</div></header>
<main class="wrap">
<div class="sims" id="sims" aria-label="Các mô phỏng trong chương"></div>
<div class="lab">
<section class="stage">
<div class="sh"><div><h2 id="st"></h2><p id="sp"></p></div>
<div class="tp"><button class="ib" id="play" aria-label="Tạm dừng"></button><button class="ib" id="rst" aria-label="Chạy lại từ đầu"><svg viewBox="0 0 24 24"><path d="M4 12a8 8 0 1 0 2.4-5.7"/><path d="M4 4v5h5"/></svg></button></div></div>
<div class="cvb"><canvas id="gl" aria-hidden="true"></canvas><canvas id="cv" role="img"></canvas></div>
</section>
<aside class="panel">
<p class="hint" id="hint" hidden></p>
<div id="spdw"><span class="lbl">Tốc độ hiển thị</span>
<div class="seg" id="spd"><button data-s=".25" aria-pressed="false">0,25×</button><button data-s=".5" aria-pressed="false">0,5×</button><button data-s="1" aria-pressed="true">1×</button></div></div>
<div class="ctls" id="ctls"></div>
<dl class="reads" id="reads"></dl>
<button class="lnk" id="def">Khôi phục giá trị mặc định</button>
</aside>
</div>
<section class="info" id="info"></section>
</main>
<footer class="foot"><p>Mô phỏng minh họa theo chương trình Vật lý 11 (GDPT 2018). Một số chuyển động được làm chậm hoặc phóng to để dễ quan sát; các số đo trong bảng được tính đúng theo công thức với giá trị bạn chọn.</p></footer>

(function(){function show(m){var b=document.getElementById('jserr');if(!b){b=document.createElement('div');b.id='jserr';b.style.cssText='position:fixed;left:8px;right:8px;bottom:8px;z-index:99;background:#d92d20;color:#fff;padding:10px 12px;border-radius:10px;font:14px/1.4 system-ui,sans-serif';document.body.appendChild(b)}b.textContent='Lỗi trình duyệt: '+m}
window.addEventListener('error',function(e){show((e.message||'')+(e.lineno?' (dòng '+e.lineno+':'+e.colno+')':''))});})();
</script>
